# Pages CMS(https://app.pagescms.org) 웹 에디터 설정입니다.
# 저장하면 main 에 커밋되고 GitHub Actions 가 바로 배포합니다.

media:
  input: assets/img/posts
  output: /assets/img/posts
  categories: [image]
  # 한글 파일명은 주소에서 깨지기 쉬워서 업로드할 때 임의의 영문 이름으로 바꿉니다.
  rename: random

content:
  - name: posts
    label: 글
    type: collection
    path: _posts
    exclude: [.placeholder]
    # 한글 제목으로는 영문 파일 이름을 만들지 못해서(2026-10-04-.md 처럼 비어 버림)
    # 필수 입력란 "주소"(slug)로 파일 이름과 글 주소 /posts/<주소>/ 를 정합니다.
    filename:
      template: "{year}-{month}-{day}-{fields.slug}.md"
      field: false
    view:
      fields: [title, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: slug
        label: 주소 (영문 소문자와 하이픈, 예 crema-carta-clock → /posts/crema-carta-clock/)
        type: string
        required: true
      - name: description
        label: 요약 (글 목록과 검색 결과에 보임)
        type: string
      - name: date
        label: 날짜
        type: date
        options:
          time: true
          # 시간대를 붙이면 UTC(+0000)로 저장되어 미래 글로 빠지므로, 시간대 없이 저장해 _config.yml 의 Asia/Seoul 로 해석되게 합니다.
          format: "yyyy-MM-dd HH:mm:ss"
      - name: categories
        label: 카테고리 (첫 번째가 상위, 두 번째가 하위 카테고리)
        type: string
        list: true
      - name: tags
        label: 태그
        type: string
        list: true
      - name: image
        label: 대표 이미지 (선택)
        type: image
      - name: featured
        label: 홈의 "주요 글"에 표시
        type: boolean
        default: false
      - name: published
        label: 공개 (끄면 저장만 되고 블로그에는 나오지 않음)
        type: boolean
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  - name: about
    label: 정보 페이지
    type: file
    path: _tabs/about.md
    fields:
      - name: icon
        type: string
        hidden: true
        default: fas fa-info-circle
      - name: order
        type: number
        hidden: true
        default: 4
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
