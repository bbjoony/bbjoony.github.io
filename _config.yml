title: The life is REAL
author: bbjoony
email: bbjoony@gmail.com
description: > 
  중년의 게임QA가 기록하는 일상과 업무 이야기.
  게임 테스팅 경험과 개인적인 생각들을 나누는 공간입니다.

# 테마는 Clean Blog 테마 사용 (로컬 테마)

plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true

# _layouts/default.html 등 plainwhite 기반 레이아웃이 읽는 설정
plainwhite:
  name: bbjoony
  tagline: 중년 게임QA의 일상과 업무 이야기
  # portfolio_image: assets/profile.png   # 프로필 사진을 넣으면 주석을 풉니다
  html_lang: ko
  date_format: "%Y년 %-m월 %-d일"
  # 아이콘 폰트용 plainwhite CSS 가 아직 없어서 켜면 빈 점만 보입니다. CSS 복구 후 주석을 풉니다.
  # social_links:
  #   github: bbjoony
  #   email: bbjoony@gmail.com
  navigation:
    - title: Posts
      url: /posts
    - title: About
      url: /about

# 사이트로 배포하지 않을 파일(Jekyll 3 은 이 목록이 기본값을 대체하므로 기본 항목도 함께 적습니다)
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - "*.gemspec"
  - bin
  - "-old"
  - README.md
  - CLAUDE.md
  - WARP.md
  - WARP_PROJECT.md
  - LICENSE
  - LICENSE.txt
  - screenshot.png
